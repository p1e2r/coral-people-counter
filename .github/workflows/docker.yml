name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      # The top-down stage is pinned to amd64 (Coral's compiler is x86-only), so it
      # runs natively once and is shared by both platform builds.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the top-down model made it into the image
        if: github.event_name != 'pull_request'
        run: |
          img=ghcr.io/${{ github.repository }}:sha-$(git rev-parse --short HEAD)
          docker run --rm --entrypoint sh "$img" -c 'ls -la /models; if [ -f /models/TOPDOWN_FAILED.txt ]; then cat /models/TOPDOWN_FAILED.txt; echo "::warning::top-down model was not built"; fi'
          docker run --rm --entrypoint python3 "$img" -c "import detector; print(detector.model_list()); print(detector.topdown_status())"
